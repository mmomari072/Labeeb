[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labeeb"
version = "2.3.6"
authors = [
    { name = "Mohammed Omari", email = "mmomari072@gmail.com" }
]
description = "An interface for conducting sensitivity and uncertainty analysis for codes using text files as input decks"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.18.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.0.0",
    "xlrd>=2.0.0",
]
parquet = [
    "pyarrow>=10.0.0",
]
jinja2 = [
    "jinja2>=3.0.0",
]
plot = [
    "matplotlib>=3.0.0",
]
surrogate = [
    "scikit-learn>=1.0",
    "scipy>=1.7",
]
all = [
    "openpyxl>=3.0.0",
    "pyarrow>=10.0.0",
    "jinja2>=3.0.0",
    "matplotlib>=3.0.0",
    "scikit-learn>=1.0",
    "scipy>=1.7",
]
dev = [
    "pytest>=7.0.0",
    "tomli>=1.1; python_version < '3.11'",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
    "jinja2>=3.0.0",
    "matplotlib>=3.0.0",
]

[project.scripts]
labeeb = "labeeb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labeeb = ["py.typed"]
